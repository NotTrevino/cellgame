<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="input.js"></script>
  <script src="ui.js"></script>
  <script src="backend/server.js"></script>
</head>

<body onkeydown="getKeyAndMove(event)">
  <table style="width: 700px;" align="center">
    <tr>
      <td colspan="4">
        <h1 align="center">
          <span id="local-prefix" style="visibility:hidden; width:55px; display:inline-block;">Local </span>
          <select id="mode-select" onchange="switchMode(this.value); this.blur();">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
          </select>
          Player Cell Game
        </h1>
      </td>
    </tr>
    <tr>
      <td id="label1" width="25%"></td>
      <td id="value1" style="font-size: 30px;"></td>
      <td id="label2" width="25%"></td>
      <td id="value2" style="font-size: 30px;"></td>
    </tr>
    <tr>
      <td colspan="4">
        <div id="box">
          <div id="redball"></div>
          <div id="blueball"></div>
        </div>
      </td>
    </tr>
    <tr>
      <td colspan="4" align="center" id="instructions">
        Use WASD and arrow keys to move.<br>
        Reach maximum size first or eat the other ball to win!
      </td>
    </tr>
  </table>
  <div id="auth-bar" align="center" style="margin-top:14px;font-family:Arial,sans-serif;font-size:14px;">
    <!-- populated by renderAuthBar() -->
  </div>
  <h3 align="center" style="font-family:Arial,sans-serif;margin-top:22px;margin-bottom:8px;">🏆 Leaderboard — Top 10
  </h3>
  <table align="center" style="width:420px;border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px;">
    <thead>
      <tr style="background:#f4f4f4;">
        <th style="padding:7px 14px;border:1px solid #ccc;width:40px;">#</th>
        <th style="padding:7px 14px;border:1px solid #ccc;">Player</th>
        <th style="padding:7px 14px;border:1px solid #ccc;width:80px;">Time</th>
      </tr>
    </thead>
    <tbody id="leaderboard-body">
      <tr>
        <td colspan="3" align="center" style="padding:10px;color:#888;">Loading…</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
