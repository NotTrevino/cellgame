<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body onkeydown="getKeyAndMove(event)">
    <table style="width: 700px;" align="center">
      <tr>
        <td colspan="4">
          <h1 align="center">Cell Game</h1>
        </td>
      </tr>
      <tr>
        <td style="color: red;" width="25%">
          Red Wins:
        </td>
        <td style="color: red; font-size: 30px;" id="red-wins">
          0
        </td>
        <td style="color: blue;" width="25%">
          Blue Wins:
        </td>
        <td style="color: blue; font-size: 30px;" id="blue-wins">
          0
        </td>
      </tr>
      <tr>
        <td colspan="4">
          <div id="box">
            <div id="redball"></div>
            <div id="blueball"></div>
          </div>
        </td>
      </tr>
      <tr>
        <td colspan="4" align="center">
          Use WASD and arrow keys to move.<br>
          Reach maximum size first or eat the other ball to win!
        </td>
      </tr>
    </table>
  </body>
</html>
